[package]
name = "app"
version = "1.1.3"
description = "Zero-Downtime Deploy Desktop App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 部署引擎（SSH/授权）专属依赖。
# 纯壳(开源)构建不开启此 feature，这些依赖不会被编译，
# 从构建产物与漏洞面中彻底移除；完整版构建时开启。
default = []
engine = [
  "dep:ssh2",
  "dep:libssh2-sys",
  "dep:libc",
  "dep:uuid",
  "dep:rayon",
  "dep:walkdir",
  "dep:flate2",
  "dep:tar",
  "dep:sha2",
  "dep:ed25519-dalek",
  "dep:pkcs8",
  "dep:base32",
  "dep:shellexpand",
  "dep:ssh-key",
]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
# 以下为部署引擎专属依赖（engine feature），纯壳构建不编译
ssh2 = { version = "0.9", features = ["vendored-openssl"], optional = true }
libssh2-sys = { version = "=0.3.1", optional = true }
libc = { version = "0.2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
rayon = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
dirs = "5"
walkdir = { version = "2", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
aes-gcm = "0.10"
argon2 = "0.5"
hex = "0.4"
zeroize = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"], optional = true }
pkcs8 = { version = "0.10", features = ["pem"], optional = true }
base32 = { version = "0.5", optional = true }
shellexpand = { version = "3", optional = true }
tauri-plugin-clipboard-manager = "2.3.2"
# 关闭 default features 以甩掉 rsa/p256/p384/p521 依赖链
# （default 的 std feature 会启用它们；rsa 存在无补丁的
#   RUSTSEC-2023-0071 Marvin Attack advisory，会阻塞 CI audit）。
# 引擎仅用 ed25519 密钥解析与加密私钥支持，无需 RSA/ECDSA。
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ed25519", "encryption"], optional = true }
tempfile = "3.27.0"
rand = "0.8"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
